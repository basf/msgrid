[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msgrid"
dynamic = ["version"]
description = "MLP (lipophilic) and MEP (electrostatic) potential grids for a single molecule, in pure Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Miguel Angel Bayo Valero (BASF SE)" },
    { name = "Dmitry Suplatov (BASF SE)" },
    { name = "Valerio Ferrario (BASF SE)" },
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
pdb2pqr = ["pdb2pqr"]
test = [
    "pytest",
    "gridDataFormats",
]

[project.scripts]
MLP = "msgrid.mlp:main"
MEP = "msgrid.mep:main"
msgrid = "msgrid.cli:main"

[tool.setuptools.dynamic]
version = { attr = "msgrid.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
